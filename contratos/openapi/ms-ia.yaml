openapi: 3.0.3
info:
  title: ms-ia
  version: '1'
  description: >
    Read model de reportes, servidor MCP (unica via de acceso de IA a los datos),
    reportes en lenguaje natural (tarea 4, proveedor Groq), agentes LangGraph, ML/DL.
    /vision/analizar y /agentes (tareas 5-6) se agregan en una pasada aparte.
servers:
  - url: http://localhost:8085
tags:
  - name: salud
  - name: mcp
  - name: reportes

paths:
  /salud:
    get:
      tags: [salud]
      summary: Liveness
      security: []
      responses:
        '200':
          description: El proceso esta arriba
          content:
            application/json:
              schema:
                type: object
                properties: { estado: { type: string, example: ok } }

  /listo:
    get:
      tags: [salud]
      summary: Readiness (ping real a Postgres)
      security: []
      responses:
        '200':
          description: Listo para atender trafico
        '503':
          description: Postgres no disponible

  /api/v1/mcp/auditoria:
    get:
      tags: [mcp]
      summary: Historial de llamadas al servidor MCP (exitosas, fallidas y bloqueadas)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Pagina de registros de auditoria_mcp
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RegistroAuditoriaMcp' }
                  page: { type: integer }
                  size: { type: integer }
        '401': { description: Falta o es invalido el token }
        '403': { description: 'El rol del token no alcanza (requiere ejecutivo|gerente)' }

  /mcp:
    post:
      tags: [mcp]
      summary: >
        Transporte Streamable HTTP del servidor MCP real (SDK oficial `mcp`). Expone 4
        herramientas tipadas de solo lectura contra vista_mcp_*: consultar_campanas,
        facturas_por_vencer, clientes_morosos, resumen_gasto_campana — ver
        documentacion/03-contratos.md "MCP (ms-ia)". No es un endpoint REST
        convencional (sigue el protocolo MCP, no este schema de request/response);
        se documenta aqui solo para dejar constancia de que existe y requiere JWT
        (roles ejecutivo|gerente|creativo).
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Respuesta del protocolo MCP (Streamable HTTP) }
        '401': { description: Falta o es invalido el token }
        '403': { description: El rol del token no alcanza }

  /api/v1/reportes:
    post:
      tags: [reportes]
      summary: >
        Genera un reporte a partir de una pregunta en lenguaje natural. El LLM (Groq)
        decide que herramienta(s) MCP llamar -- nunca toca SQL directo, pasa por la
        misma ConsultasMcp auditada que usa el servidor MCP real (ver /mcp).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pregunta]
              properties: { pregunta: { type: string } }
      responses:
        '201':
          description: Reporte generado (o repetido, si la Idempotency-Key ya se uso con los mismos datos)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReporteGenerado' }
        '400': { description: 'Falta pregunta o Idempotency-Key' }
        '401': { description: Falta o es invalido el token }
        '403': { description: 'El rol del token no alcanza (requiere ejecutivo|gerente|creativo)' }
        '409': { description: 'La Idempotency-Key ya se uso con una pregunta distinta' }

  /api/v1/reportes/{id}:
    get:
      tags: [reportes]
      summary: Recupera un reporte ya generado
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Reporte encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReporteGenerado' }
        '404': { description: No existe un reporte con ese id }

  /api/v1/reportes/{id}/exportar:
    get:
      tags: [reportes]
      summary: Exporta un reporte ya generado a PDF o Excel (tabla + grafico cuando aplica)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: formato, in: query, required: false, schema: { type: string, enum: [pdf, xlsx], default: pdf } }
      responses:
        '200':
          description: Archivo binario (application/pdf o application/vnd.openxmlformats-officedocument.spreadsheetml.sheet)
        '404': { description: No existe un reporte con ese id }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegistroAuditoriaMcp:
      type: object
      properties:
        id: { type: string, format: uuid }
        agente_id: { type: string, format: uuid, nullable: true }
        usuario_id: { type: string, format: uuid, nullable: true }
        herramienta: { type: string }
        parametros: { type: object }
        resultado_resumen: { type: object, nullable: true }
        exito: { type: boolean }
        bloqueado: { type: boolean }
        motivo_bloqueo: { type: string, nullable: true }
        error: { type: string, nullable: true }
        duracion_ms: { type: integer }
        creado_en: { type: string, format: date-time }
    ReporteGenerado:
      description: >
        Forma acordada con aplicaciones/panel-inteligencia (React, ya construido en la
        rama del companero sobre este mismo contrato) -- ver decision D15.
      type: object
      properties:
        id: { type: string, format: uuid }
        pregunta: { type: string }
        titulo: { type: string }
        generado_en: { type: string, format: date-time, nullable: true }
        interpretacion:
          type: object
          properties:
            herramienta: { type: string }
            parametros: { type: object }
        columnas:
          type: array
          items:
            type: object
            properties:
              clave: { type: string }
              etiqueta: { type: string }
              tipo: { type: string, enum: [texto, numero, dinero, fecha, porcentaje] }
              moneda: { type: string, enum: [BOB, USD] }
        filas:
          type: array
          items: { type: object }
        grafico:
          type: object
          nullable: true
          properties:
            tipo: { type: string, enum: [barras, linea] }
            x: { type: string }
            y: { type: string }
        respuesta_nl: { type: string, nullable: true }
        estado: { type: string, enum: [listo, fallido] }
