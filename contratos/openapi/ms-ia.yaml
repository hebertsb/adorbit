openapi: 3.0.3
info:
  title: ms-ia
  version: '1'
  description: >
    Read model de reportes, servidor MCP (unica via de acceso de IA a los datos),
    reportes en lenguaje natural (tarea 4, proveedor Groq), agentes internos (tarea 5:
    monitor_campanas, cobranza) y ML/DL (tarea 6: riesgo de impago, segmentacion y
    anomalias de campanas, vision por YOLO) -- ver D19/D20 en
    documentacion/05-decisiones-y-pendientes.md sobre el alcance de los modelos.
servers:
  - url: http://localhost:8085
tags:
  - name: salud
  - name: mcp
  - name: reportes
  - name: agentes
  - name: ml
  - name: vision

paths:
  /salud:
    get:
      tags: [salud]
      summary: Liveness
      security: []
      responses:
        '200':
          description: El proceso esta arriba
          content:
            application/json:
              schema:
                type: object
                properties: { estado: { type: string, example: ok } }

  /listo:
    get:
      tags: [salud]
      summary: Readiness (ping real a Postgres)
      security: []
      responses:
        '200':
          description: Listo para atender trafico
        '503':
          description: Postgres no disponible

  /api/v1/mcp/auditoria:
    get:
      tags: [mcp]
      summary: Historial de llamadas al servidor MCP (exitosas, fallidas y bloqueadas)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Pagina de registros de auditoria_mcp
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RegistroAuditoriaMcp' }
                  page: { type: integer }
                  size: { type: integer }
        '401': { description: Falta o es invalido el token }
        '403': { description: 'El rol del token no alcanza (requiere ejecutivo|gerente)' }

  /mcp:
    post:
      tags: [mcp]
      summary: >
        Transporte Streamable HTTP del servidor MCP real (SDK oficial `mcp`). Expone 4
        herramientas tipadas de solo lectura contra vista_mcp_*: consultar_campanas,
        facturas_por_vencer, clientes_morosos, resumen_gasto_campana — ver
        documentacion/03-contratos.md "MCP (ms-ia)". No es un endpoint REST
        convencional (sigue el protocolo MCP, no este schema de request/response);
        se documenta aqui solo para dejar constancia de que existe y requiere JWT
        (roles ejecutivo|gerente|creativo).
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Respuesta del protocolo MCP (Streamable HTTP) }
        '401': { description: Falta o es invalido el token }
        '403': { description: El rol del token no alcanza }

  /api/v1/reportes:
    post:
      tags: [reportes]
      summary: >
        Genera un reporte a partir de una pregunta en lenguaje natural. El LLM (Groq)
        decide que herramienta(s) MCP llamar -- nunca toca SQL directo, pasa por la
        misma ConsultasMcp auditada que usa el servidor MCP real (ver /mcp).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pregunta]
              properties: { pregunta: { type: string } }
      responses:
        '201':
          description: Reporte generado (o repetido, si la Idempotency-Key ya se uso con los mismos datos)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReporteGenerado' }
        '400': { description: 'Falta pregunta o Idempotency-Key' }
        '401': { description: Falta o es invalido el token }
        '403': { description: 'El rol del token no alcanza (requiere ejecutivo|gerente|creativo)' }
        '409': { description: 'La Idempotency-Key ya se uso con una pregunta distinta' }

  /api/v1/reportes/{id}:
    get:
      tags: [reportes]
      summary: Recupera un reporte ya generado
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Reporte encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReporteGenerado' }
        '404': { description: No existe un reporte con ese id }

  /api/v1/reportes/{id}/exportar:
    get:
      tags: [reportes]
      summary: Exporta un reporte ya generado a PDF o Excel (tabla + grafico cuando aplica)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: formato, in: query, required: false, schema: { type: string, enum: [pdf, xlsx], default: pdf } }
      responses:
        '200':
          description: Archivo binario (application/pdf o application/vnd.openxmlformats-officedocument.spreadsheetml.sheet)
        '404': { description: No existe un reporte con ese id }

  /api/v1/agentes:
    get:
      tags: [agentes]
      summary: Lista los agentes internos configurados (monitor_campanas, cobranza, ...)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de agentes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Agente' }
        '401': { description: Falta o es invalido el token }
        '403': { description: 'El rol del token no alcanza (requiere ejecutivo|gerente)' }

  /api/v1/agentes/{id}/ejecutar:
    post:
      tags: [agentes]
      summary: >
        Dispara una corrida del agente (disparador de n8n: cron -> HTTP Request node ->
        este endpoint). monitor_campanas revisa campanas activas y publica AlertaCampana
        (via outbox) si el gasto llega al 90% del presupuesto; cobranza revisa facturas
        por vencer/vencidas y clientes morosos y devuelve el resumen en la propia
        respuesta, sin publicar evento (vista_mcp_facturacion no expone campana_id).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { disparador: { type: string, example: 'cron (n8n)' } }
      responses:
        '201':
          description: Ejecucion creada (o repetida, si la Idempotency-Key ya se uso con los mismos datos)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EjecucionAgente' }
        '400': { description: 'Falta Idempotency-Key' }
        '401': { description: Falta o es invalido el token }
        '403': { description: 'El rol del token no alcanza (requiere ejecutivo|gerente)' }
        '404': { description: No existe un agente activo con ese id }
        '409': { description: 'La Idempotency-Key ya se uso con una entrada distinta' }

  /api/v1/ml/riesgo-cliente/{id}:
    get:
      tags: [ml]
      summary: Probabilidad de impago de un cliente (roi_xgboost, datos sinteticos -- ver D19)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: cliente_id }
      responses:
        '200':
          description: Prediccion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiesgoCliente' }
        '401': { description: Falta o es invalido el token }
        '403': { description: 'El rol del token no alcanza (requiere ejecutivo|gerente)' }
        '404': { description: No existe el cliente }
        '503': { description: El modelo no esta registrado/activo todavia }

  /api/v1/ml/segmentacion-campanas:
    get:
      tags: [ml]
      summary: Segmenta las campanas activas (kmeans_campanas) y marca anomalias de gasto (isolation_forest_campanas)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: solo_anomalias, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Lista de campanas segmentadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SegmentoCampana' } }
        '401': { description: Falta o es invalido el token }
        '403': { description: 'El rol del token no alcanza (requiere ejecutivo|gerente)' }

  /api/v1/vision/analizar:
    post:
      tags: [vision]
      summary: >
        Deteccion de objetos sobre una pieza con YOLOv8n pre-entrenado (COCO-80, sin
        afinar -- ver D20). Idempotente por contenido (huella SHA-256 de la imagen),
        no por Idempotency-Key.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [pieza_id, archivo]
              properties:
                pieza_id: { type: string, format: uuid }
                campana_id: { type: string, format: uuid, nullable: true }
                origen: { type: string, enum: [web_local, movil_local, servidor], default: servidor }
                archivo: { type: string, format: binary, description: 'image/jpeg o image/png, maximo 10 MB' }
      responses:
        '201':
          description: Resultado del analisis (nuevo o el ya guardado para esa misma imagen+modelo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisionResultado' }
        '400': { description: 'parametro_invalido (mime no soportado, origen invalido, imagen demasiado grande)' }
        '401': { description: Falta o es invalido el token }
        '403': { description: 'El rol del token no alcanza (requiere ejecutivo|gerente|creativo)' }
        '503': { description: El modelo no esta registrado/activo todavia }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegistroAuditoriaMcp:
      type: object
      properties:
        id: { type: string, format: uuid }
        agente_id: { type: string, format: uuid, nullable: true }
        usuario_id: { type: string, format: uuid, nullable: true }
        herramienta: { type: string }
        parametros: { type: object }
        resultado_resumen: { type: object, nullable: true }
        exito: { type: boolean }
        bloqueado: { type: boolean }
        motivo_bloqueo: { type: string, nullable: true }
        error: { type: string, nullable: true }
        duracion_ms: { type: integer }
        creado_en: { type: string, format: date-time }
    ReporteGenerado:
      description: >
        Forma acordada con aplicaciones/panel-inteligencia (React, ya construido en la
        rama del companero sobre este mismo contrato) -- ver decision D15.
      type: object
      properties:
        id: { type: string, format: uuid }
        pregunta: { type: string }
        titulo: { type: string }
        generado_en: { type: string, format: date-time, nullable: true }
        interpretacion:
          type: object
          properties:
            herramienta: { type: string }
            parametros: { type: object }
        columnas:
          type: array
          items:
            type: object
            properties:
              clave: { type: string }
              etiqueta: { type: string }
              tipo: { type: string, enum: [texto, numero, dinero, fecha, porcentaje] }
              moneda: { type: string, enum: [BOB, USD] }
        filas:
          type: array
          items: { type: object }
        grafico:
          type: object
          nullable: true
          properties:
            tipo: { type: string, enum: [barras, linea] }
            x: { type: string }
            y: { type: string }
        respuesta_nl: { type: string, nullable: true }
        estado: { type: string, enum: [listo, fallido] }
    Agente:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, example: monitor_campanas }
        mision: { type: string }
        habilidades: { type: array, items: { type: string } }
        disparador: { type: string, nullable: true, example: 'cron (n8n)' }
        activo: { type: boolean }
    EjecucionAgente:
      type: object
      properties:
        id: { type: string, format: uuid }
        agente_id: { type: string, format: uuid }
        disparador: { type: string, nullable: true }
        estado: { type: string, enum: [en_curso, exitosa, fallida] }
        salida: { type: object, nullable: true }
        error: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    RiesgoCliente:
      type: object
      properties:
        cliente_id: { type: string, format: uuid }
        cliente_nombre: { type: string }
        features:
          type: object
          properties:
            proporcion_uso: { type: number }
            linea_credito_limite: { type: number }
            monto_vencido_total: { type: number }
            dias_vencida_max: { type: integer }
            facturas_vencidas_count: { type: integer }
        probabilidad_impago: { type: number, minimum: 0, maximum: 1 }
        nivel_riesgo: { type: string, enum: [bajo, medio, alto] }
        calculado_en: { type: string, format: date }
    SegmentoCampana:
      type: object
      properties:
        campana_id: { type: string, format: uuid }
        nombre: { type: string }
        presupuesto_total: { type: number }
        gasto_actual: { type: number }
        cluster: { type: integer }
        segmento: { type: string, enum: [bajo_consumo, saludable, cerca_del_limite] }
        es_anomalia: { type: boolean }
        puntaje_anomalia: { type: number, description: 'mas negativo = mas anomalo' }
    VisionResultado:
      type: object
      properties:
        id: { type: string, format: uuid }
        pieza_id: { type: string, format: uuid }
        campana_id: { type: string, format: uuid, nullable: true }
        modelo_id: { type: string, format: uuid }
        huella_imagen: { type: string }
        origen: { type: string, enum: [web_local, movil_local, servidor] }
        detecta_logo: { type: boolean, nullable: true, description: 'prediccion real de yolo_logo_adorbit (modelo afinado), ver D21; null solo si ese modelo no esta cargado' }
        detecta_texto: { type: boolean, nullable: true, description: 'null siempre: ningun modelo hace OCR, ver D20' }
        manual_marca_ok: { type: boolean, nullable: true }
        confianza: { type: number, nullable: true }
        objetos_detectados:
          type: array
          items:
            type: object
            properties:
              clase: { type: string }
              confianza: { type: number }
              caja_xyxy: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }
        duracion_ms: { type: integer }
        creado_en: { type: string, format: date-time, nullable: true }
