<div class="app">
  <aside class="app__lateral" [class.app__lateral--abierta]="menuAbierto()">
    <div class="app__marca">
      <ao-logo-adorbit [tamano]="44" />
      AdOrbit
    </div>
    <ao-barra-lateral (click)="cerrarMenu()" />

    <div class="app__pie-lateral">
      <button
        type="button"
        class="interruptor-tema"
        (click)="tema.alternar()"
        [attr.aria-pressed]="tema.temaActual() === 'oscuro'"
      >
        <span class="interruptor-tema__texto">
          <svg class="ic" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" /></svg>
          Modo oscuro
        </span>
        <span class="interruptor-tema__pista" [class.interruptor-tema__pista--activa]="tema.temaActual() === 'oscuro'">
          <span class="interruptor-tema__bolita"></span>
        </span>
      </button>
      <p class="app__pie-nota">AdOrbit · Plataforma Publicitaria</p>
    </div>
  </aside>

  @if (menuAbierto()) {
    <button type="button" class="app__fondo-menu" aria-label="Cerrar menú" (click)="cerrarMenu()"></button>
  }

  <div class="app__principal">
    <div class="app__barra-superior">
      <button
        type="button"
        class="app__boton-menu"
        (click)="alternarMenu()"
        [attr.aria-expanded]="menuAbierto()"
        aria-label="Abrir menú de navegación"
      >
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <ao-barra-superior />
    </div>
    <main class="app__contenido">
      <router-outlet />
    </main>
  </div>
</div>
