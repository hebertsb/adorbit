server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Compresión: el JS/CSS/JSON viaja ~70 % más liviano.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  # Archivos con hash en el nombre (main-XXXX.js, chunk-XXXX.js, styles-XXXX.css): nunca
  # cambian, se guardan 1 año y el navegador no vuelve a preguntar en cada carga.
  location ~* ^/(main|chunk|polyfills|styles)-[A-Za-z0-9_-]+\.(js|css)$ {
    include /etc/nginx/seguridad.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /service-worker.js {
    include /etc/nginx/seguridad.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/seguridad.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /configuracion-panel.js {
    include /etc/nginx/seguridad.inc;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # ONNX Runtime Web + modelo YOLO: .mjs/.wasm con MIME correcto (nosniff bloquea octet-stream)
  location /ort/ {
    include /etc/nginx/seguridad.inc;
    types {
      application/javascript js mjs;
      application/wasm wasm;
    }
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  location /modelos/ {
    include /etc/nginx/seguridad.inc;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  location /graphql {
    proxy_pass http://pasarela:8000/graphql;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  location /api/ {
    proxy_pass http://pasarela:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /realms/ {
    proxy_pass http://100.99.124.109:8180/realms/;
    proxy_http_version 1.1;
    proxy_set_header Host 4.151.177.116;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Host 4.151.177.116;
    proxy_set_header X-Forwarded-Port 80;
  }

  location /resources/ {
    proxy_pass http://100.99.124.109:8180/resources/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
  }

  location /mailpit/ {
    proxy_pass http://100.99.124.109:8025/mailpit/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /panel-inteligencia/ {
    proxy_pass http://panel-inteligencia:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /portal-cliente {
    return 301 /portal-cliente/;
  }

  location /portal-cliente/ {
    proxy_pass http://portal-cliente:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    include /etc/nginx/seguridad.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  location = /salud {
    include /etc/nginx/seguridad.inc;
    default_type application/json;
    return 200 '{"estado":"vivo","servicio":"portal-gestion"}';
  }
}
