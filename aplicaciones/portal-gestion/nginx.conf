server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location = /service-worker.js {
    include /etc/nginx/seguridad.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/seguridad.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /configuracion-panel.js {
    include /etc/nginx/seguridad.inc;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location /graphql {
    proxy_pass http://pasarela:8000/graphql;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  location /api/ {
    proxy_pass http://pasarela:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /realms/ {
    proxy_pass http://100.99.124.109:8180/realms/;
    proxy_http_version 1.1;
    proxy_set_header Host 100.99.124.109:8180;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /resources/ {
    proxy_pass http://100.99.124.109:8180/resources/;
    proxy_http_version 1.1;
    proxy_set_header Host 100.99.124.109:8180;
  }

  location / {
    include /etc/nginx/seguridad.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  location = /salud {
    include /etc/nginx/seguridad.inc;
    default_type application/json;
    return 200 '{"estado":"vivo","servicio":"portal-gestion"}';
  }
}
