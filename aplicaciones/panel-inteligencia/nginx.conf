server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # El remoto lo carga OTRO origen (el contenedor del portal de gestion): hace falta CORS en el codigo publico.
  # Es JavaScript estatico sin credenciales ni datos, por eso se permite cualquier origen.
  location = /remoteEntry.js {
    include /etc/nginx/seguridad.inc;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  location /assets/ {
    include /etc/nginx/seguridad.inc;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Modo independiente (SPA): cualquier ruta entrega index.html. Solo la pagina propia se protege del enmarcado;
  # el remoto se carga como script, no en un iframe.
  location / {
    include /etc/nginx/seguridad.inc;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }

  location = /salud { include /etc/nginx/seguridad.inc; default_type application/json; return 200 '{"estado":"vivo"}'; }
}
