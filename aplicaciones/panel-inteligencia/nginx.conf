server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), geolocation=()" always; # el microfono se permite: es para dictar

  # El remoto lo carga OTRO origen (el contenedor del portal de gestion): hace falta CORS en el codigo publico.
  # Es JavaScript estatico sin credenciales ni datos, por eso se permite cualquier origen.
  location = /remoteEntry.js {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  location /assets/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Modo independiente (SPA): cualquier ruta entrega index.html.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options DENY always;
    try_files $uri /index.html;
  }

  location = /salud { default_type application/json; return 200 '{"estado":"vivo"}'; }
}
