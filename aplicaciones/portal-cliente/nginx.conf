server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # En el despliegue conviene sumar una CSP con el connect-src real (APIs y emisor OIDC).

  # El service worker y el manifiesto nunca se cachean: asi las versiones nuevas llegan enseguida.
  location = /sw.js { include /etc/nginx/seguridad.inc; add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location = /manifest.webmanifest { include /etc/nginx/seguridad.inc; add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location /assets/ { include /etc/nginx/seguridad.inc; add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }

  # Aplicacion de una sola pagina: cualquier ruta del portal entrega index.html.
  location / { include /etc/nginx/seguridad.inc; add_header Cache-Control "no-cache" always; try_files $uri /index.html; }

  location = /salud { include /etc/nginx/seguridad.inc; default_type application/json; return 200 '{"estado":"vivo"}'; }
}
