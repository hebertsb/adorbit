server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad. connect-src se completa con las APIs y el emisor OIDC reales en el despliegue.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # El service worker y el manifiesto nunca se cachean: asi las versiones nuevas llegan enseguida.
  location = /sw.js { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # Aplicacion de una sola pagina: cualquier ruta del portal entrega index.html.
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }

  location = /salud { default_type application/json; return 200 '{"estado":"vivo"}'; }
}
