server:
  port: ${ADORBIT_FACTURACION_PUERTO:8082}

spring:
  application:
    name: ms-facturacion
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true

  rabbitmq:
    host: ${ADORBIT_FACTURACION_RABBITMQ_HOST:localhost}
    port: ${ADORBIT_FACTURACION_RABBITMQ_PUERTO:5672}
    username: ${ADORBIT_FACTURACION_RABBITMQ_USUARIO:}
    password: ${ADORBIT_FACTURACION_RABBITMQ_CLAVE:}
    virtual-host: ${ADORBIT_FACTURACION_RABBITMQ_VHOST:/}
    ssl:
      enabled: ${ADORBIT_FACTURACION_RABBITMQ_SSL:false}
    publisher-confirm-type: simple
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: ${ADORBIT_FACTURACION_REINTENTO_INICIAL:1s}
          multiplier: 2
          max-interval: 30s

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO

adorbit:
  facturacion:
    seguridad:
      jwks-uri: ${ADORBIT_FACTURACION_JWKS_URI}
      emisor: ${ADORBIT_FACTURACION_JWT_EMISOR}
      audiencia: ${ADORBIT_FACTURACION_JWT_AUDIENCIA:ms-facturacion}
      cors-origenes: ${ADORBIT_FACTURACION_CORS_ORIGENES:}
    negocio:
      tasa-impuesto: ${ADORBIT_FACTURACION_TASA_IMPUESTO:0.13}
      dias-vencimiento: ${ADORBIT_FACTURACION_DIAS_VENCIMIENTO:30}
    mensajeria:
      activa: ${ADORBIT_FACTURACION_MENSAJERIA_ACTIVA:true}
      cola-comandos: saga.facturacion
      intervalo-relevo: ${ADORBIT_FACTURACION_INTERVALO_RELEVO:1s}
    dynamodb:
      region: ${ADORBIT_FACTURACION_DYNAMODB_REGION:us-east-1}
      tabla: ${ADORBIT_FACTURACION_DYNAMODB_TABLA:AdOrbitFacturacion}
      endpoint: ${ADORBIT_FACTURACION_DYNAMODB_ENDPOINT:}
