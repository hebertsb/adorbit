# Solo para desarrollar ms-clientes-crm sin esperar el compose general de infraestructura/.
# MongoDB como replica set de un nodo: es lo que permite transacciones (igual que Atlas).
services:
  mongo:
    image: mongo:7.0.14
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
