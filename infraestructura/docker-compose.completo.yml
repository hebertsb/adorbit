# Sistema completo de AdOrbit en una sola red. Uso (desde infraestructura/):
#   cp .env.ejemplo .env            # completar los secretos (el .env no se versiona)
#   docker compose -f docker-compose.completo.yml up -d --build                      # parte de Integrante B
#   docker compose -f docker-compose.completo.yml --profile equipo up -d --build     # + servicios de Roly y Hebert
#   docker compose -f docker-compose.completo.yml --profile equipo --profile mensajeria up -d --build # incluye workers CRM
# Activar mensajeria puede procesar eventos pendientes contra las bases conectadas.
#
# Identidad: Keycloak real con Authorization Code + PKCE para portales/app y client_credentials para n8n.
# RabbitMQ: el local de este compose (no toca el CloudAMQP compartido).
# Datos: DynamoDB real en AWS (ms-facturacion) y MongoDB Atlas (ms-clientes-crm).

x-jwt-emisor: &emisor ${EMISOR_JWT:-http://localhost:8180/realms/adorbit}

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: adorbit-rabbitmq
    ports: ["5672:5672", "15672:15672"]
    volumes:
      - ../plataforma/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ../plataforma/rabbitmq/definiciones.json:/etc/rabbitmq/definiciones.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [adorbit-red]

  keycloak:
    build: { context: ../plataforma/keycloak }
    container_name: adorbit-keycloak
    ports: ["8180:8080"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?completar en .env}
      KEYCLOAK_SEED_PASSWORD: ${KEYCLOAK_SEED_PASSWORD:?completar en .env}
      N8N_CLIENT_SECRET: ${N8N_CLIENT_SECRET:?completar en .env}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?completar en .env}
      KC_HOSTNAME_URL: http://localhost:8180
    networks: [adorbit-red]

  # ------------------------------------------------------------------ Integrante B
  ms-facturacion:
    build: { context: ../servicios/ms-facturacion }
    container_name: adorbit-ms-facturacion
    ports: ["8082:8082"]
    environment:
      ADORBIT_FACTURACION_PUERTO: "8082"
      ADORBIT_FACTURACION_JWKS_URI: http://keycloak:8080/realms/adorbit/protocol/openid-connect/certs
      ADORBIT_FACTURACION_JWT_EMISOR: *emisor
      ADORBIT_FACTURACION_JWT_AUDIENCIA: ms-facturacion
      ADORBIT_FACTURACION_DYNAMODB_REGION: ${AWS_REGION:-us-east-1}
      ADORBIT_FACTURACION_DYNAMODB_TABLA: ${FACTURACION_TABLA:-AdOrbitFacturacion}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?completar en .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?completar en .env}
      ADORBIT_FACTURACION_MENSAJERIA_ACTIVA: "true"
      ADORBIT_FACTURACION_RABBITMQ_HOST: rabbitmq
      ADORBIT_FACTURACION_RABBITMQ_PUERTO: "5672"
      ADORBIT_FACTURACION_RABBITMQ_USUARIO: ${RABBITMQ_USUARIO:-guest}
      ADORBIT_FACTURACION_RABBITMQ_CLAVE: ${RABBITMQ_CLAVE:-guest}
      ADORBIT_FACTURACION_CORS_ORIGENES: http://localhost:4173,http://localhost:5173,http://localhost:4200
    depends_on:
      rabbitmq: { condition: service_healthy }
      keycloak: { condition: service_started }
    networks: [adorbit-red]

  ms-clientes-crm:
    build: { context: ../servicios/ms-clientes-crm }
    container_name: adorbit-ms-clientes-crm
    ports: ["8084:8084"]
    environment: &entorno-crm
      APP_KEY: ${CRM_APP_KEY:?completar en .env (php artisan key:generate --show)}
      DB_CONNECTION: mongodb
      ADORBIT_CRM_MONGO_DSN: ${CRM_MONGO_DSN:?completar en .env}
      ADORBIT_CRM_MONGO_BD: ${CRM_MONGO_BD:-adorbit_crm}
      ADORBIT_CRM_JWKS_URI: http://keycloak:8080/realms/adorbit/protocol/openid-connect/certs
      ADORBIT_CRM_JWT_EMISOR: *emisor
      ADORBIT_CRM_JWT_AUDIENCIA: ms-clientes-crm
      ADORBIT_CRM_RABBITMQ_HOST: rabbitmq
      ADORBIT_CRM_RABBITMQ_PUERTO: "5672"
      ADORBIT_CRM_RABBITMQ_USUARIO: ${RABBITMQ_USUARIO:-guest}
      ADORBIT_CRM_RABBITMQ_CLAVE: ${RABBITMQ_CLAVE:-guest}
      ADORBIT_CRM_CORS_ORIGENES: http://localhost:4173,http://localhost:5173,http://localhost:4200
    depends_on:
      rabbitmq: { condition: service_healthy }
      keycloak: { condition: service_started }
    networks: [adorbit-red]

  # Procesos separados de la API; solo se activan explicitamente con el perfil mensajeria.
  crm-consumidor:
    profiles: [mensajeria]
    build: { context: ../servicios/ms-clientes-crm }
    command: ["php", "artisan", "crm:consumir-comandos"]
    environment: *entorno-crm
    healthcheck: { disable: true }
    restart: unless-stopped
    depends_on:
      rabbitmq: { condition: service_healthy }
    networks: [adorbit-red]

  crm-publicador:
    profiles: [mensajeria]
    build: { context: ../servicios/ms-clientes-crm }
    command: ["php", "artisan", "crm:publicar-bandeja"]
    environment: *entorno-crm
    healthcheck: { disable: true }
    restart: unless-stopped
    depends_on:
      rabbitmq: { condition: service_healthy }
    networks: [adorbit-red]

  portal-cliente:
    build:
      context: ../aplicaciones/portal-cliente
      args:
        VITE_OIDC_AUTORIDAD: http://localhost:8180/realms/adorbit
        VITE_API_FACTURACION_URL: http://localhost:8082
        VITE_API_CRM_URL: http://localhost:8084
    container_name: adorbit-portal-cliente
    ports: ["4173:8080"]
    depends_on: [ms-facturacion, ms-clientes-crm]
    networks: [adorbit-red]

  panel-inteligencia:
    build:
      context: ../aplicaciones/panel-inteligencia
      args:
        VITE_OIDC_AUTORIDAD: http://localhost:8180/realms/adorbit
        VITE_API_IA_URL: http://localhost:8085
    container_name: adorbit-panel-inteligencia
    ports: ["4174:8080"]
    networks: [adorbit-red]

  portal-gestion:
    profiles: [equipo]
    build: { context: ../aplicaciones/portal-gestion }
    container_name: adorbit-portal-gestion
    ports: ["4200:8080"]
    depends_on:
      pasarela: { condition: service_started }
      panel-inteligencia: { condition: service_started }
    networks: [adorbit-red]

  n8n:
    image: n8nio/n8n:2.45.7
    container_name: adorbit-n8n
    ports: ["5678:5678"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-clave-local-n8n-solo-desarrollo}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: America/La_Paz
      TZ: America/La_Paz
      ADORBIT_KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/adorbit/protocol/openid-connect/token
      ADORBIT_N8N_CLIENT_ID: n8n
      ADORBIT_N8N_CLIENT_SECRET: ${N8N_CLIENT_SECRET:-secreto-local}
      ADORBIT_N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-token-webhook-local}
      ADORBIT_FACTURACION_URL: http://ms-facturacion:8082
      ADORBIT_CRM_URL: http://ms-clientes-crm:8084
      ADORBIT_CAMPANAS_URL: http://ms-campanas:8081
      ADORBIT_CORREO_REMITENTE: "AdOrbit <no-responder@adorbit.local>"
      ADORBIT_CORREO_GERENCIA: gerencia@adorbit.local
      ADORBIT_WHATSAPP_TOKEN: ${ADORBIT_WHATSAPP_TOKEN:-}
      ADORBIT_WHATSAPP_PHONE_ID: ${ADORBIT_WHATSAPP_PHONE_ID:-}
      ADORBIT_WHATSAPP_NUMERO_GERENCIA: ${ADORBIT_WHATSAPP_NUMERO_GERENCIA:-+59170000000}
    volumes:
      - n8n_datos:/home/node/.n8n
      - ../plataforma/n8n/flujos:/flujos:ro
      - ../plataforma/n8n/credenciales.ejemplo.json:/credenciales/credenciales.json:ro
    depends_on: [mailpit, ms-facturacion, ms-clientes-crm]
    networks: [adorbit-red]

  mailpit:
    image: axllent/mailpit:v1.29.0
    container_name: adorbit-mailpit
    ports: ["8025:8025", "1025:1025"]
    networks: [adorbit-red]

  # ------------------------------------------------------- Roly y Hebert (perfil "equipo")
  ms-campanas:
    profiles: [equipo]
    build: { context: ../servicios/ms-campanas }
    container_name: adorbit-ms-campanas
    ports: ["8081:8081"]
    develop:
      watch:
        - action: rebuild
          path: src
        - action: rebuild
          path: pom.xml
    environment:
      PORT: "8081"
      SPRING_PROFILES_ACTIVE: prod
      ADORBIT_CAMPANAS_URL_RABBITMQ: amqp://${RABBITMQ_USUARIO:-guest}:${RABBITMQ_CLAVE:-guest}@rabbitmq:5672
      SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP: "true"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: *emisor
      # jwk-set-uri tiene prioridad sobre issuer-uri en Spring Boot (evita el round-trip de
      # auto-discovery a *emisor, que usa "localhost" -- desde DENTRO del contenedor eso es
      # el propio contenedor, no el de keycloak, y la resolucion fallaba con Connection
      # refused). Mismo patron que ya usan ms-facturacion/ms-clientes-crm/etc, que no pasan
      # por auto-discovery.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/adorbit/protocol/openid-connect/certs
      ADORBIT_CAMPANAS_AUDIENCIA_JWT: ms-campanas
      ADORBIT_CAMPANAS_URL_BD: ${CAMPANAS_URL_BD:-}
      ADORBIT_CAMPANAS_USUARIO_BD: ${CAMPANAS_USUARIO_BD:-}
      ADORBIT_CAMPANAS_CONTRASENA_BD: ${CAMPANAS_CONTRASENA_BD:-}
      # Permite provocar de forma controlada total_no_coincide en la prueba de
      # compensacion; en operacion normal coincide con facturacion (13 %).
      ADORBIT_CAMPANAS_NEGOCIO_TASA_IMPUESTO: ${CAMPANAS_TASA_IMPUESTO:-0.13}
      ADORBIT_CAMPANAS_SAGA_TIEMPO_LIMITE_SEGUNDOS: ${CAMPANAS_TIEMPO_LIMITE_SEGUNDOS:-600}
    depends_on:
      rabbitmq: { condition: service_healthy }
      keycloak: { condition: service_started }
    networks: [adorbit-red]

  ms-creatividades:
    profiles: [equipo]
    build: { context: ../servicios/ms-creatividades }
    container_name: adorbit-ms-creatividades
    ports: ["8083:8083"]
    develop:
      watch:
        - action: rebuild
          path: src
        - action: rebuild
          path: package.json
    environment:
      ADORBIT_CREATIVIDADES_URL_BD: ${CREATIVIDADES_URL_BD:-}
      ADORBIT_CREATIVIDADES_JWKS_URI: http://keycloak:8080/realms/adorbit/protocol/openid-connect/certs
      ADORBIT_CREATIVIDADES_EMISOR: *emisor
      ADORBIT_CREATIVIDADES_AUDIENCIA: ms-creatividades
      ADORBIT_CREATIVIDADES_RABBITMQ_URL: amqp://${RABBITMQ_USUARIO:-guest}:${RABBITMQ_CLAVE:-guest}@rabbitmq:5672
      ADORBIT_CREATIVIDADES_SUPABASE_URL: ${CREATIVIDADES_SUPABASE_URL:-}
      ADORBIT_CREATIVIDADES_SUPABASE_SERVICE_KEY: ${CREATIVIDADES_SUPABASE_SERVICE_KEY:-}
      ADORBIT_CREATIVIDADES_SUPABASE_BUCKET: ${CREATIVIDADES_SUPABASE_BUCKET:-piezas-creatividades}
    depends_on:
      rabbitmq: { condition: service_healthy }
      keycloak: { condition: service_started }
    networks: [adorbit-red]

  ms-ia:
    profiles: [equipo]
    build: { context: ../servicios/ms-ia }
    container_name: adorbit-ms-ia
    ports: ["8085:8085"]
    develop:
      watch:
        - action: rebuild
          path: app
        - action: rebuild
          path: requirements.txt
    environment:
      ADORBIT_IA_URL_BD: ${IA_URL_BD:-}
      ADORBIT_IA_URL_BD_LECTOR_MCP: ${IA_URL_BD_LECTOR_MCP:-}
      ADORBIT_IA_JWKS_URI: http://keycloak:8080/realms/adorbit/protocol/openid-connect/certs
      ADORBIT_IA_EMISOR: *emisor
      ADORBIT_IA_AUDIENCIA: ms-ia
      ADORBIT_IA_RABBITMQ_URL: amqp://${RABBITMQ_USUARIO:-guest}:${RABBITMQ_CLAVE:-guest}@rabbitmq:5672
      ADORBIT_IA_GROQ_API_KEY: ${IA_GROQ_API_KEY:-}
      ADORBIT_IA_GROQ_MODELO: ${IA_GROQ_MODELO:-openai/gpt-oss-120b}
    depends_on:
      rabbitmq: { condition: service_healthy }
      keycloak: { condition: service_started }
    networks: [adorbit-red]

  pasarela:
    profiles: [equipo]
    build: { context: ../plataforma/pasarela }
    container_name: adorbit-pasarela
    ports: ["8000:8000"]
    develop:
      watch:
        - action: rebuild
          path: src
        - action: rebuild
          path: package.json
    environment:
      PORT: "8000"
      ADORBIT_ULTRAMSG_INSTANCE: ${ADORBIT_ULTRAMSG_INSTANCE:-}
      ADORBIT_ULTRAMSG_TOKEN: ${ADORBIT_ULTRAMSG_TOKEN:-}
      ADORBIT_WHATSAPP_NUMERO_GERENCIA: ${ADORBIT_WHATSAPP_NUMERO_GERENCIA:-+59169215158}
      ADORBIT_PASARELA_JWKS_URI: http://keycloak:8080/realms/adorbit/protocol/openid-connect/certs
      ADORBIT_PASARELA_EMISOR: *emisor
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_REALM: adorbit
      KEYCLOAK_ADMIN_CLIENT_ID: pasarela-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?completar en .env}
      URL_MS_CAMPANAS: http://ms-campanas:8081
      URL_MS_FACTURACION: http://ms-facturacion:8082
      URL_MS_CREATIVIDADES: http://ms-creatividades:8083
      URL_MS_CLIENTES_CRM: http://ms-clientes-crm:8084
      URL_MS_IA: http://ms-ia:8085
    depends_on:
      keycloak: { condition: service_started }
    networks: [adorbit-red]

volumes:
  n8n_datos:

networks:
  adorbit-red:
    name: adorbit-red
    driver: bridge
