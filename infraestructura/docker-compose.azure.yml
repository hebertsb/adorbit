# AdOrbit · Docker Compose para Azure (Despliegue de Hebert)
# Aloja ms-campanas (SAGA Orchestrator), pasarela (API Gateway / GraphQL) y portal-gestion (Angular 18)
# Conectado a CloudAMQP Central Broker, AWS (Facturación/CRM) y Servidor Personal (IA/Creatividades/Keycloak)

services:
  ms-campanas:
    build:
      context: ../servicios/ms-campanas
    container_name: adorbit-ms-campanas
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      ADORBIT_CAMPANAS_URL_BD: ${CAMPANAS_URL_BD}
      ADORBIT_CAMPANAS_USUARIO_BD: ${CAMPANAS_USUARIO_BD}
      ADORBIT_CAMPANAS_CONTRASENA_BD: ${CAMPANAS_CONTRASENA_BD}
      ADORBIT_CAMPANAS_URL_RABBITMQ: ${RABBITMQ_URL}
      ADORBIT_CAMPANAS_CONSUMIDOR_ACTIVO: "true"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${EMISOR_JWT:-http://4.151.177.116/realms/adorbit}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${ADORBIT_CAMPANAS_JWKS_URI:-http://100.99.124.109:8180/realms/adorbit/protocol/openid-connect/certs}
      ADORBIT_CAMPANAS_AUDIENCIA_JWT: ms-campanas
    networks:
      - adorbit-azure-red

  pasarela:
    build:
      context: ../plataforma/pasarela
    container_name: adorbit-pasarela
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      URL_MS_CAMPANAS: http://ms-campanas:8081
      URL_MS_CLIENTES_CRM: ${URL_MS_CLIENTES_CRM:-https://star-three-surveillance-repeat.trycloudflare.com}
      URL_MS_FACTURACION: ${URL_MS_FACTURACION:-https://medicines-annotation-bag-investor.trycloudflare.com}
      URL_MS_CREATIVIDADES: ${URL_MS_CREATIVIDADES:-http://100.99.124.109:8083}
      URL_MS_IA: ${URL_MS_IA:-http://100.99.124.109:8085}
      EMISOR_JWT: ${EMISOR_JWT:-http://4.151.177.116/realms/adorbit}
      ADORBIT_PASARELA_EMISOR: ${ADORBIT_PASARELA_EMISOR:-http://4.151.177.116/realms/adorbit}
      ADORBIT_PASARELA_JWKS_URI: ${ADORBIT_PASARELA_JWKS_URI:-http://100.99.124.109:8180/realms/adorbit/protocol/openid-connect/certs}
      AUDIENCIA_JWT: pasarela
      KEYCLOAK_ADMIN_BASE_URL: ${KEYCLOAK_ADMIN_BASE_URL:-http://100.99.124.109:8180}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      ADORBIT_ULTRAMSG_INSTANCE: ${ADORBIT_ULTRAMSG_INSTANCE}
      ADORBIT_ULTRAMSG_TOKEN: ${ADORBIT_ULTRAMSG_TOKEN}
      # n8n (home-lab por Tailscale): API publica de solo lectura para la pantalla Automatizaciones
      ADORBIT_PASARELA_N8N_URL: ${ADORBIT_PASARELA_N8N_URL:-http://100.99.124.109:5678}
      ADORBIT_PASARELA_N8N_EDITOR_URL: ${ADORBIT_PASARELA_N8N_EDITOR_URL:-http://100.99.124.109:5678}
      ADORBIT_PASARELA_N8N_API_KEY: ${ADORBIT_PASARELA_N8N_API_KEY:-}
    depends_on:
      - ms-campanas
    networks:
      - adorbit-azure-red

  panel-inteligencia:
    build:
      context: ../aplicaciones/panel-inteligencia
    container_name: adorbit-panel-inteligencia
    restart: unless-stopped
    networks:
      - adorbit-azure-red

  portal-cliente:
    build:
      context: ../aplicaciones/portal-cliente
    container_name: adorbit-portal-cliente
    restart: unless-stopped
    ports:
      - "8082:8080"
    networks:
      - adorbit-azure-red

  portal-gestion:
    build:
      context: ../aplicaciones/portal-gestion
    container_name: adorbit-portal-gestion
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - pasarela
      - panel-inteligencia
      - portal-cliente
    networks:
      - adorbit-azure-red

networks:
  adorbit-azure-red:
    name: adorbit-azure-red
    driver: bridge
