# n8n + servidor de correo de prueba (Mailpit) para desarrollo local. Los servicios (ms-facturacion, ms-clientes-crm),
# RabbitMQ y el Keycloak simulado corren en la maquina anfitriona: n8n los alcanza por host.docker.internal.
services:
  n8n:
    image: n8nio/n8n:2.45.7
    ports:
      - "5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-clave-local-n8n-solo-desarrollo}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"   # los flujos leen sus parametros con $env.ADORBIT_*
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: America/La_Paz
      TZ: America/La_Paz
      ADORBIT_KEYCLOAK_TOKEN_URL: ${ADORBIT_KEYCLOAK_TOKEN_URL:-http://host.docker.internal:8180/realms/adorbit/protocol/openid-connect/token}
      ADORBIT_N8N_CLIENT_ID: ${ADORBIT_N8N_CLIENT_ID:-n8n}
      ADORBIT_N8N_CLIENT_SECRET: ${ADORBIT_N8N_CLIENT_SECRET:-secreto-local}
      ADORBIT_N8N_WEBHOOK_TOKEN: ${ADORBIT_N8N_WEBHOOK_TOKEN:-token-webhook-local}
      ADORBIT_FACTURACION_URL: ${ADORBIT_FACTURACION_URL:-http://host.docker.internal:8082}
      ADORBIT_CRM_URL: ${ADORBIT_CRM_URL:-http://host.docker.internal:8084}
      ADORBIT_CAMPANAS_URL: ${ADORBIT_CAMPANAS_URL:-http://host.docker.internal:8081}
      ADORBIT_CORREO_REMITENTE: ${ADORBIT_CORREO_REMITENTE:-AdOrbit <no-responder@adorbit.local>}
      ADORBIT_CORREO_GERENCIA: ${ADORBIT_CORREO_GERENCIA:-gerencia@adorbit.local}
    volumes:
      - n8n_datos:/home/node/.n8n
      - ./flujos:/flujos:ro
      - ./credenciales.ejemplo.json:/credenciales/credenciales.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mailpit
  mailpit:
    image: axllent/mailpit:v1.29.0
    ports:
      - "8025:8025"   # interfaz web para ver los correos
      - "1025:1025"   # SMTP

volumes:
  n8n_datos:
